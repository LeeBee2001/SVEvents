<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Ablauf – SVEvents</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="content" hidden>
  <div class="page-head">
    <div>
      <h1>Ablauf &amp; Aufgaben</h1>
      <p class="muted">Zeitpunkte beziehen sich auf T0. Verschiebst du T0, verschiebt sich der ganze Ablauf mit.</p>
    </div>
  </div>
  <div id="empty" class="empty" hidden><b>Noch kein Event</b>Lege unter „Events“ das erste Event an.</div>
  <div id="eventPart" hidden>
    <div class="toolbar"><div class="field"><label for="eventSel">Event</label><select id="eventSel"></select></div></div>
    <div class="hero" style="margin-bottom:8px">
      <div class="kicker" id="nextKicker">Nächster Punkt</div>
      <div class="countdown" id="nextCount">–</div>
      <div class="when" id="nextTitle"></div>
    </div>

    <section class="section">
      <div class="section-head"><h2>Ablauf</h2><button class="btn" type="button" id="newItem">Punkt hinzufügen</button></div>
      <div id="run"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Aufgaben</h2><button class="btn" type="button" id="newTask">Aufgabe hinzufügen</button></div>
      <div id="tasks"></div>
    </section>
  </div>
</main>

<dialog id="itDlg">
  <form class="dlg" id="itForm" method="dialog" autocomplete="off">
    <div class="dlg-body">
      <h3 id="itTitleH" style="margin:0 0 12px">Ablaufpunkt</h3>
      <div class="field"><label for="itTitle">Was passiert?</label><input id="itTitle" maxlength="120" placeholder="z. B. Türen auf"></div>
      <div class="grid-2">
        <div class="field"><label for="itSign">Zeitpunkt</label><select id="itSign"><option value="-1">vor T0 (T −)</option><option value="1">nach T0 (T +)</option></select></div>
        <div class="field"><label for="itOff">Abstand (hh:mm:ss)</label><input id="itOff" placeholder="01:30:00" inputmode="numeric"></div>
      </div>
      <div class="field"><label for="itStation">Station (optional)</label><select id="itStation"></select></div>
      <div class="field"><label for="itNote">Notiz (optional)</label><input id="itNote" maxlength="500"></div>
    </div>
    <div class="dlg-foot"><button class="btn secondary" type="button" id="itCancel">Abbrechen</button><button class="btn" type="submit" id="itOk">Speichern</button></div>
  </form>
</dialog>

<dialog id="tkDlg">
  <form class="dlg" id="tkForm" method="dialog" autocomplete="off">
    <div class="dlg-body">
      <h3 id="tkTitleH" style="margin:0 0 12px">Aufgabe</h3>
      <div class="field"><label for="tkTitle">Aufgabe</label><input id="tkTitle" maxlength="160" placeholder="z. B. Technik testen"></div>
      <div class="field"><label for="tkWho">Zuständig (optional)</label><select id="tkWho"></select></div>
      <div class="grid-2">
        <div class="field"><label for="tkSign">Frist</label><select id="tkSign"><option value="0">keine Frist</option><option value="-1">vor T0</option><option value="1">nach T0</option></select></div>
        <div class="field"><label for="tkOff">Abstand (hh:mm:ss)</label><input id="tkOff" placeholder="24:00:00" inputmode="numeric"></div>
      </div>
      <div class="field"><label for="tkNote">Notiz (optional)</label><input id="tkNote" maxlength="500"></div>
    </div>
    <div class="dlg-foot"><button class="btn secondary" type="button" id="tkCancel">Abbrechen</button><button class="btn" type="submit" id="tkOk">Speichern</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  const ctx = await SV.start({ page: 'ablauf', roles: ['admin'] });
  if (!ctx) return;
  const sb = ctx.sb;
  const { esc, fmt, $ } = SV;
  let events = [], cur = null, items = [], tasks = [], stations = [], staff = [], editIt = null, editTk = null;

  const p2 = (n) => String(n).padStart(2, '0');
  const hms = (s) => { s = Math.abs(s); return p2(Math.floor(s / 3600)) + ':' + p2(Math.floor((s % 3600) / 60)) + ':' + p2(s % 60); };
  const offLabel = (s) => 'T ' + (s < 0 ? '−' : '+') + ' ' + hms(s);
  // "1:30:00", "90:00", "45" (Sekunden nicht erlaubt ohne Doppelpunkt: dann Minuten) -> Sekunden oder null
  function parseHms(v) {
    const m = String(v).trim().match(/^(\d{1,3})(?::(\d{1,2}))?(?::(\d{1,2}))?$/);
    if (!m) return null;
    const a = +m[1], b = m[2] == null ? 0 : +m[2], c = m[3] == null ? 0 : +m[3];
    if (b > 59 || c > 59) return null;
    return m[2] == null ? a * 60 : a * 3600 + b * 60 + c;   // nur eine Zahl = Minuten
  }
  const t0Of = () => { const v = cur.t0 || cur.starts_at; return v ? new Date(v).getTime() : null; };
  const clock = (s) => { const t0 = t0Of(); if (t0 == null) return ''; const d = new Date(t0 + s * 1000); return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); };
  const stName = (id) => (stations.find((x) => x.id === id) || {}).name || '';

  async function load() {
    const ev = cur;
    const [a, b, c] = await Promise.all([
      sb.from('run_items').select('*').eq('event_id', ev.id).order('offset_s'),
      sb.from('tasks').select('*').eq('event_id', ev.id).order('created_at'),
      sb.from('stations').select('id, name').eq('event_id', ev.id).order('sort')
    ]);
    [a, b, c].forEach((r) => { if (r.error) throw r.error; });
    if (cur !== ev) return;
    items = a.data; tasks = b.data; stations = c.data;
    render();
  }

  function render() {
    const t0 = t0Of();
    $('run').innerHTML = items.length
      ? '<div class="tablewrap"><table class="data"><thead><tr><th>T</th><th>Uhrzeit</th><th>Was</th><th>Station</th><th></th></tr></thead><tbody>' +
        items.map((i) => '<tr data-id="' + i.id + '"><td class="num">' + esc(offLabel(i.offset_s)) + '</td><td class="num">' + esc(clock(i.offset_s)) + '</td><td>' + esc(i.title) +
          (i.note ? '<div class="muted small">' + esc(i.note) + '</div>' : '') + '</td><td class="muted">' + esc(stName(i.station_id)) + '</td>' +
          '<td class="right"><button class="btn link" type="button" data-act="editIt">Bearbeiten</button><button class="btn link" type="button" data-act="delIt">Löschen</button></td></tr>').join('') +
        '</tbody></table></div>'
      : '<p class="muted">Noch kein Ablauf. Füge z. B. „Aufbau“ (T − 03:00:00) und „Türen auf“ (T − 00:30:00) hinzu.</p>';
    $('tasks').innerHTML = tasks.length
      ? tasks.map((k) => '<div class="rowline" data-id="' + k.id + '"><label class="check" style="flex:1"><input type="checkbox" data-act="toggle"' + (k.done_at ? ' checked' : '') + '> <span' + (k.done_at ? ' style="text-decoration:line-through;opacity:.6"' : '') + '>' + esc(k.title) + '</span>' +
          '<div class="muted small">' + [k.assignee ? esc((staff.find((p) => p.id === k.assignee) || {}).name || '') : 'niemand zugewiesen', k.due_offset_s == null ? '' : 'Frist ' + esc(offLabel(k.due_offset_s)), esc(k.note || '')].filter(Boolean).join(' · ') + '</div></label>' +
          '<div><button class="btn link" type="button" data-act="editTk">Bearbeiten</button><button class="btn link" type="button" data-act="delTk">Löschen</button></div></div>').join('')
      : '<p class="muted">Noch keine Aufgaben.</p>';
    if (t0 == null) $('nextTitle').textContent = 'Lege T0 oder eine Startzeit des Events fest.';
    tick();
  }

  function tick() {
    if (!cur) return;
    const t0 = t0Of(), el = $('nextCount');
    if (t0 == null) { el.textContent = '–'; return; }
    const rel = Math.floor((SV.serverNow() - t0) / 1000);   // Sekunden seit T0
    const next = items.find((i) => i.offset_s > rel);
    if (!next) { el.textContent = items.length ? 'Ablauf beendet' : 'Kein Ablauf'; $('nextTitle').textContent = ''; el.classList.add('past'); return; }
    el.classList.remove('past');
    el.textContent = 'in ' + hms(next.offset_s - rel);
    $('nextTitle').textContent = offLabel(next.offset_s) + ' · ' + next.title;
    document.querySelectorAll('#run tr[data-id]').forEach((tr) => {
      const it = items.find((x) => x.id === tr.dataset.id);
      tr.style.opacity = it.offset_s <= rel ? '.5' : '';
      tr.style.fontWeight = it === next ? '650' : '';
    });
  }

  // ---- Ablaufpunkt ----
  function openItem(it) {
    editIt = it || null;
    $('itTitleH').textContent = it ? 'Ablaufpunkt bearbeiten' : 'Ablaufpunkt hinzufügen';
    $('itTitle').value = it ? it.title : '';
    $('itSign').value = it && it.offset_s > 0 ? '1' : '-1';
    $('itOff').value = it ? hms(it.offset_s) : '';
    $('itNote').value = it ? (it.note || '') : '';
    $('itStation').innerHTML = '<option value="">– keine –</option>' + stations.map((s) => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join('');
    $('itStation').value = it && it.station_id ? it.station_id : '';
    $('itDlg').showModal();
  }
  $('newItem').addEventListener('click', () => openItem(null));
  $('itCancel').addEventListener('click', () => $('itDlg').close());
  $('itForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = $('itTitle').value.trim();
    const abs = parseHms($('itOff').value === '' ? '0' : $('itOff').value);
    if (!title) return SV.toast('Bitte beschreibe, was passiert.', 'bad');
    if (abs == null || abs > 604800) return SV.toast('Abstand bitte als hh:mm:ss eingeben, z. B. 01:30:00.', 'bad');
    const row = { title: title, offset_s: abs * parseInt($('itSign').value, 10), note: $('itNote').value.trim() || null, station_id: $('itStation').value || null };
    await SV.busy($('itOk'), async () => {
      const r = editIt ? await sb.from('run_items').update(row).eq('id', editIt.id) : await sb.from('run_items').insert(Object.assign({ event_id: cur.id }, row));
      if (r.error) return SV.fail(r.error);
      $('itDlg').close(); await load();
    });
  });

  // ---- Aufgabe ----
  function openTask(k) {
    editTk = k || null;
    $('tkTitleH').textContent = k ? 'Aufgabe bearbeiten' : 'Aufgabe hinzufügen';
    $('tkTitle').value = k ? k.title : '';
    $('tkNote').value = k ? (k.note || '') : '';
    $('tkWho').innerHTML = '<option value="">– niemand –</option>' + staff.map((p) => '<option value="' + p.id + '">' + esc(p.name) + '</option>').join('');
    $('tkWho').value = k && k.assignee ? k.assignee : '';
    $('tkSign').value = k && k.due_offset_s != null ? (k.due_offset_s > 0 ? '1' : '-1') : '0';
    $('tkOff').value = k && k.due_offset_s != null ? hms(k.due_offset_s) : '';
    $('tkDlg').showModal();
  }
  $('newTask').addEventListener('click', () => openTask(null));
  $('tkCancel').addEventListener('click', () => $('tkDlg').close());
  $('tkForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = $('tkTitle').value.trim();
    if (!title) return SV.toast('Bitte gib die Aufgabe ein.', 'bad');
    let due = null;
    if ($('tkSign').value !== '0') {
      const abs = parseHms($('tkOff').value === '' ? '0' : $('tkOff').value);
      if (abs == null || abs > 2592000) return SV.toast('Abstand bitte als hh:mm:ss eingeben, z. B. 24:00:00.', 'bad');
      due = abs * parseInt($('tkSign').value, 10);
    }
    const row = { title: title, assignee: $('tkWho').value || null, due_offset_s: due, note: $('tkNote').value.trim() || null };
    await SV.busy($('tkOk'), async () => {
      const r = editTk ? await sb.from('tasks').update(row).eq('id', editTk.id) : await sb.from('tasks').insert(Object.assign({ event_id: cur.id }, row));
      if (r.error) return SV.fail(r.error);
      $('tkDlg').close(); await load();
    });
  });

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const row = b.closest('[data-id]');
    const id = row && row.dataset.id;
    try {
      if (b.dataset.act === 'editIt') openItem(items.find((x) => x.id === id));
      else if (b.dataset.act === 'editTk') openTask(tasks.find((x) => x.id === id));
      else if (b.dataset.act === 'delIt') {
        const r = await sb.from('run_items').delete().eq('id', id); if (r.error) return SV.fail(r.error); await load();
      } else if (b.dataset.act === 'delTk') {
        const r = await sb.from('tasks').delete().eq('id', id); if (r.error) return SV.fail(r.error); await load();
      }
    } catch (err) { SV.fail(err); }
  });
  document.addEventListener('change', async (e) => {
    const b = e.target.closest('[data-act=toggle]');
    if (!b) return;
    const r = await sb.rpc('task_set_done', { p_task: b.closest('[data-id]').dataset.id, p_done: b.checked });
    if (r.error) SV.fail(r.error);
    await load();
  });

  function pick() {
    cur = events.find((x) => x.id === $('eventSel').value) || null;
    return cur ? load().catch(SV.fail) : Promise.resolve();
  }

  try {
    await SV.syncClock();
    events = await SV.loadEvents();
    $('empty').hidden = events.length > 0;
    $('eventPart').hidden = events.length === 0;
    const p = await sb.from('profiles').select('id, name').neq('role', 'admin').eq('active', true).order('name');
    if (p.error) throw p.error;
    staff = p.data || [];
    if (events.length) {
      SV.fillEventSelect($('eventSel'), events);
      $('eventSel').addEventListener('change', pick);
      await pick();
      setInterval(tick, 250);
    }
  } catch (e) { SV.fail(e); }
})();
</script>
</body>
</html>
