<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3fbf">
<title>Abstimmen – SVEvents</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --c1: #1f3fbf; --c2: #14286f; --bg: #f2f3f5; --card: #fff; --ink: #15171c; --muted: #5b6270; --line: #dcdfe5; --on: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --card: #1a1d24; --ink: #f1f2f5; --muted: #9aa1ae; --line: #2c313b; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  .top { background: linear-gradient(135deg, var(--c1), var(--c2)); color: var(--on); padding: calc(18px + env(safe-area-inset-top)) 16px 22px; }
  .top .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .top img { height: 42px; max-width: 90px; object-fit: contain; }
  .top .ev { font-size: 14px; opacity: .85; }
  .top h1 { margin: 2px 0 0; font-size: 24px; line-height: 1.15; overflow-wrap: anywhere; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); }
  label.lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; font: inherit; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--card); border: 2px solid var(--line);
    border-radius: 14px; padding: 12px; margin-bottom: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .opt.sel { border-color: var(--c1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c1) 22%, transparent); }
  .opt img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; background: var(--bg); }
  .opt .t { flex: 1; min-width: 0; }
  .opt .t b { display: block; font-size: 17px; overflow-wrap: anywhere; }
  .opt .t span { font-size: 14px; color: var(--muted); }
  .mark { width: 26px; height: 26px; flex: none; border: 2px solid var(--line); display: grid; place-items: center; font-size: 16px; color: var(--on); }
  .mark.r { border-radius: 50%; } .mark.c { border-radius: 8px; }
  .opt.sel .mark { background: var(--c1); border-color: var(--c1); }
  .stars { display: flex; gap: 2px; flex: none; }
  .stars button { font-size: 30px; line-height: 1; background: none; border: 0; padding: 2px; color: var(--line); cursor: pointer; }
  .stars button.on { color: #f5a524; }
  .rate { flex-wrap: wrap; cursor: default; }
  .rate .stars { margin-left: auto; }
  .btn { display: block; width: 100%; font: inherit; font-size: 18px; font-weight: 700; color: var(--on); background: var(--c1); border: 0; border-radius: 14px; padding: 15px; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .err { color: #dc2626; margin: 10px 0 0; min-height: 1.2em; font-weight: 600; }
  .big { text-align: center; padding: 28px 16px; }
  .big .ic { font-size: 52px; }
  .bar { margin: 12px 0; }
  .bar .row { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
  .bar .track { height: 14px; background: var(--bg); border-radius: 8px; overflow: hidden; margin-top: 5px; }
  .bar .fill { height: 100%; background: var(--c1); border-radius: 8px; transition: width .4s; }
  .bar.win .fill { background: #16a34a; }
  .hint { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
</style>
</head>
<body>
<div class="top"><div class="in"><img id="logo" alt="" hidden><div><div class="ev" id="ev">&nbsp;</div><h1 id="title">Abstimmung</h1></div></div></div>
<div class="wrap" id="app"><div class="card muted">Wird geladen …</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const TOKEN = (q.get('p') || '').trim();
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* egal */ } }
  };
  const hexOk = (h) => /^#[0-9a-fA-F]{6}$/.test(h || '');
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const lum = (h) => { const c = rgb(h).map((v) => v / 255).map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4))); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const mix = (a, b, k) => '#' + rgb(a).map((v, i) => Math.round(v * (1 - k) + rgb(b)[i] * k).toString(16).padStart(2, '0')).join('');

  let sb = null, poll = null, order = null, picked = [], stars = {}, done = false, busy = false, pollTimer = null;

  // Geräteschlüssel (nur für Umfragen "pro Gerät"): bleibt im Browser gespeichert
  function deviceKey() {
    let k = store.get('sv_dev');
    if (!k || k.length < 16) {
      const a = new Uint8Array(16); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.floor(Math.random() * 256); });
      k = Array.from(a).map((v) => v.toString(16).padStart(2, '0')).join('');
      store.set('sv_dev', k);
    }
    return k;
  }
  const votedKey = () => 'sv_voted_' + TOKEN.slice(0, 16);

  function theme(ev) {
    if (!ev) return;
    const c1 = hexOk(ev.accent) ? ev.accent : '#1f3fbf';
    const c2 = hexOk(ev.accent2) ? ev.accent2 : mix(c1, '#000000', 0.35);
    const r = document.documentElement.style;
    r.setProperty('--c1', c1); r.setProperty('--c2', c2);
    r.setProperty('--on', lum(mix(c1, c2, 0.5)) > 0.4 ? '#0b0d12' : '#ffffff');
    document.querySelector('meta[name=theme-color]').content = c1;
    $('ev').textContent = ev.name || '';
    const lg = $('logo');
    if (/^https:\/\//.test(ev.logo_url || '')) { lg.src = ev.logo_url; lg.hidden = false; lg.onerror = () => { lg.hidden = true; }; } else lg.hidden = true;
  }

  function shuffled(opts) {
    const a = opts.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ---- Ergebnis als Balken ----
  function resultsHtml(p) {
    const opts = p.options.slice();
    if (p.kind === 'rating') {
      const avg = (o) => (o.rating_n ? o.rating_sum / o.rating_n : 0);
      opts.sort((a, b) => avg(b) - avg(a));
      const top = opts.length ? avg(opts[0]) : 0;
      return opts.map((o) => '<div class="bar' + (top > 0 && avg(o) === top ? ' win' : '') + '"><div class="row"><span>' + esc(o.label) + '</span><span>' +
        (o.rating_n ? '★ ' + avg(o).toFixed(1).replace('.', ',') + ' <span class="muted">(' + o.rating_n + ')</span>' : '–') + '</span></div><div class="track"><div class="fill" style="width:' + (avg(o) / 5 * 100) + '%"></div></div></div>').join('');
    }
    opts.sort((a, b) => b.votes - a.votes);
    const top = opts.length ? opts[0].votes : 0;
    const base = Math.max(1, p.voters);
    return opts.map((o) => '<div class="bar' + (top > 0 && o.votes === top ? ' win' : '') + '"><div class="row"><span>' + esc(o.label) + '</span><span>' + o.votes + ' <span class="muted">(' + Math.round(o.votes / base * 100) + ' %)</span></span></div><div class="track"><div class="fill" style="width:' + (o.votes / base * 100) + '%"></div></div></div>').join('');
  }

  function msg(icon, title, text) {
    $('app').innerHTML = '<div class="card big"><div class="ic">' + icon + '</div><h2 style="margin:8px 0">' + esc(title) + '</h2><p class="muted" style="margin:0">' + esc(text || '') + '</p></div>';
  }

  function render() {
    if (!poll) return;
    $('title').textContent = poll.title || 'Abstimmung';
    if (poll.status === 'draft') return msg('⏳', 'Noch nicht gestartet', 'Die Abstimmung beginnt gleich. Diese Seite aktualisiert sich von selbst.');
    if (poll.status === 'closed') {
      $('app').innerHTML = '<div class="card"><h2 style="margin:0 0 4px">Die Abstimmung ist beendet</h2><p class="hint">' + poll.voters + ' ' + (poll.voters === 1 ? 'Stimme' : 'Stimmen') + ' abgegeben.</p>' + (poll.results_visible ? resultsHtml(poll) : '') + '</div>';
      return;
    }
    if (done) {
      $('app').innerHTML = '<div class="card big"><div class="ic">✅</div><h2 style="margin:8px 0">Danke, deine Stimme zählt!</h2><p class="muted" style="margin:0">' +
        (poll.results_visible ? 'Zwischenstand:' : 'Das Ergebnis wird nach der Abstimmung bekannt gegeben.') + '</p></div>' +
        (poll.results_visible ? '<div class="card">' + resultsHtml(poll) + '</div>' : '');
      return;
    }
    if (!order) order = shuffled(poll.options);
    const ticket = poll.eligibility === 'ticket';
    const hint = poll.kind === 'single' ? 'Wähle eine Option.' : poll.kind === 'multi' ? 'Wähle bis zu ' + poll.max_choices + ' Optionen.' : 'Vergib Sterne (1–5). Du musst nicht alle bewerten.';
    let h = '';
    if (ticket) {
      h += '<div class="card"><label class="lbl" for="code">Dein Ticket-Code</label><input id="code" type="text" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" value="' + esc(store.get('sv_code_' + TOKEN.slice(0, 16)) || '') + '">' +
        '<p class="hint" style="margin:8px 0 0">Du findest ihn auf deinem Ticket und in der Ticket-Mail. Jedes Ticket zählt einmal.</p></div>';
    }
    if (poll.description) h += '<p class="hint">' + esc(poll.description) + '</p>';
    h += '<p class="hint">' + hint + '</p><div id="opts">';
    order.forEach((o) => {
      const img = o.image_url ? '<img src="' + esc(o.image_url) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
      const txt = '<div class="t"><b>' + esc(o.label) + '</b>' + (o.note ? '<span>' + esc(o.note) + '</span>' : '') + '</div>';
      if (poll.kind === 'rating') {
        const s = stars[o.id] || 0;
        h += '<div class="opt rate" data-id="' + o.id + '">' + img + txt + '<div class="stars" role="radiogroup" aria-label="' + esc(o.label) + '">' +
          [1, 2, 3, 4, 5].map((n) => '<button type="button" data-s="' + n + '" class="' + (n <= s ? 'on' : '') + '" aria-label="' + n + ' Sterne">★</button>').join('') + '</div></div>';
      } else {
        const sel = picked.includes(o.id);
        h += '<button type="button" class="opt' + (sel ? ' sel' : '') + '" data-id="' + o.id + '">' + img + txt + '<span class="mark ' + (poll.kind === 'single' ? 'r' : 'c') + '">' + (sel && poll.kind === 'multi' ? '✓' : '') + '</span></button>';
      }
    });
    h += '</div><button class="btn" id="send" type="button">Stimme abgeben</button><div class="err" id="err" role="alert"></div>';
    $('app').innerHTML = h;
  }

  function setErr(t) { const e = $('err'); if (e) e.textContent = t || ''; }

  document.addEventListener('click', async (ev) => {
    if (!poll || poll.status !== 'open' || done) return;
    const st = ev.target.closest('.stars button');
    if (st) {
      const id = st.closest('.opt').dataset.id, n = Number(st.dataset.s);
      stars[id] = stars[id] === n ? 0 : n;
      st.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('on', Number(b.dataset.s) <= (stars[id] || 0)));
      return;
    }
    const op = ev.target.closest('button.opt');
    if (op) {
      const id = op.dataset.id;
      if (poll.kind === 'single') picked = [id];
      else if (picked.includes(id)) picked = picked.filter((x) => x !== id);
      else if (picked.length >= poll.max_choices) { setErr('Du kannst höchstens ' + poll.max_choices + ' Optionen wählen.'); return; }
      else picked.push(id);
      setErr('');
      document.querySelectorAll('button.opt').forEach((b) => {
        const s = picked.includes(b.dataset.id); b.classList.toggle('sel', s);
        const m = b.querySelector('.mark'); if (m && poll.kind === 'multi') m.textContent = s ? '✓' : '';
      });
      return;
    }
    if (ev.target.id === 'send') await send();
  });

  async function send() {
    if (busy) return;
    const ticket = poll.eligibility === 'ticket';
    let ident;
    if (ticket) {
      ident = ($('code').value || '').trim();
      if (ident.replace(/[^A-Za-z0-9]/g, '').length < 8) return setErr('Bitte gib deinen Ticket-Code ein (8 Zeichen).');
    } else ident = deviceKey();
    let choices;
    if (poll.kind === 'rating') {
      choices = Object.keys(stars).filter((id) => stars[id] > 0).map((id) => ({ o: id, s: stars[id] }));
      if (!choices.length) return setErr('Bitte vergib mindestens einen Stern.');
    } else {
      choices = picked.slice();
      if (!choices.length) return setErr('Bitte wähle eine Option.');
    }
    busy = true; $('send').disabled = true; setErr('');
    try {
      const r = await sb.rpc('poll_vote', { p_token: TOKEN, p_ident: ident, p_choices: choices });
      if (r.error) throw r.error;
      const d = r.data || {};
      if (d.ok || d.already) {
        if (ticket) store.set('sv_code_' + TOKEN.slice(0, 16), ident);
        store.set(votedKey(), '1');
        done = true; await load(); return;
      }
      setErr(d.error || 'Das hat nicht geklappt.');
    } catch (e) { setErr('Keine Verbindung. Bitte versuche es gleich noch einmal.'); }
    busy = false; const b = $('send'); if (b) b.disabled = false;
  }

  async function load() {
    try {
      const r = await sb.rpc('poll_public', { p_token: TOKEN });
      if (r.error) throw r.error;
      if (!r.data) return msg('❓', 'Abstimmung nicht gefunden', 'Bitte scanne den QR-Code noch einmal.');
      const first = !poll;
      poll = r.data;
      if (poll.event) theme(poll.event);
      if (first && poll.status === 'open' && poll.eligibility === 'device' && store.get(votedKey()) === '1') done = true;
      if (first && poll.status === 'open' && poll.eligibility === 'device' && !done) {
        const h = await sb.rpc('poll_has_voted', { p_token: TOKEN, p_ident: deviceKey() });
        if (!h.error && h.data === true) done = true;
      }
      if (poll.status === 'open' && !done && document.activeElement && document.activeElement.id === 'code') return;  // nicht beim Tippen neu zeichnen
      if (poll.status === 'open' && !done && $('opts')) { refreshLive(); return; }
      render();
    } catch (e) { if (!poll) msg('⚠️', 'Keine Verbindung', 'Bitte versuche es gleich noch einmal.'); }
  }
  // Während man auswählt, wird die Auswahl nicht neu gezeichnet; nur der Status wird beobachtet.
  function refreshLive() { /* Optionen bleiben unverändert, solange die Umfrage offen ist */ }

  function start() {
    if (!TOKEN) return msg('❓', 'Kein Abstimmungs-Link', 'Bitte scanne den QR-Code noch einmal.');
    const cfg = window.SV_CONFIG || {};
    if (!cfg.SUPABASE_URL) return msg('⚠️', 'Nicht eingerichtet', 'Die Seite ist noch nicht konfiguriert.');
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    load();
    // Wartet auf den Start bzw. zeigt später das Ergebnis
    pollTimer = setInterval(() => { if (!busy) load(); }, 5000);
  }
  start();
})();
</script>
</body>
</html>
