<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Anmelden – SVEvents</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="login">
  <img class="mark" src="icon.svg" alt="">
  <h1>SVEvents</h1>
  <p class="lead">Anmeldung für Verkauf, Einlass und Verwaltung.</p>
  <p id="notice" class="notice" role="alert" hidden></p>
  <form id="loginForm">
    <div class="field">
      <label for="email">E-Mail</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn block lg" type="submit" id="loginBtn">Anmelden</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>SV.initLogin();</script>
</body>
</html>
